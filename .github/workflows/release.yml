name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source zip
        run: bash scripts/pack-source-zip.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tool-forge-template-source.zip
          generate_release_notes: true
